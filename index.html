    --ink-soft: rgba(26, 20, 19, 0.62);
    --white: #FFFFFF;
    --font-logo: 'Tan Meringue', cursive, serif;
    --font-sans: 'DM Sans', -apple-system, sans-serif;
    --radius-md: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: linear-gradient(180deg, var(--cream) 0%, var(--beige-light) 55%, var(--beige) 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 15% 20%, rgba(115, 30, 29, 0.05) 0%, transparent 45%),
                       radial-gradient(circle at 85% 80%, rgba(77, 87, 37, 0.06) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border-radius: 28px;
    padding: 44px 32px 36px;
    box-shadow: 0 30px 70px -30px rgba(26, 20, 19, 0.22);
    border: 1px solid rgba(26, 20, 19, 0.05);
    text-align: center;
  }

  .mark {
    width: 68px;
    height: 68px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-deep) 100%);
    display: grid;
    place-items: center;
    color: var(--beige);
    font-family: 'Fraunces', serif;
    font-size: 28px;
  }

  .brand {
    font-family: var(--font-logo);
    font-weight: normal;
    font-size: 2rem;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--burgundy);
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 13px;
    color: var(--brown);
    font-style: italic;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 30px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;
    border-radius: var(--radius-md);
    text-decoration: none;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14.5px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    border: 1px solid transparent;
  }
  .link:hover { transform: translateY(-2px); }
  .link:active { transform: translateY(0); }

  .link-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .link-icon svg { width: 17px; height: 17px; }

  .link-label { flex: 1; text-align: left; }
  .link-arrow { opacity: 0.5; font-size: 14px; }

  .link-whatsapp {
    background: var(--green);
    color: var(--beige);
    box-shadow: 0 12px 24px -10px rgba(77, 87, 37, 0.35);
  }
  .link-whatsapp .link-icon { background: rgba(235, 222, 212, 0.18); color: var(--beige); }

  .link-outline {
    background: var(--beige-light);
    color: var(--ink);
    border-color: rgba(26, 20, 19, 0.08);
  }
  .link-outline:hover { background: var(--beige); }
  .link-outline .link-icon { background: rgba(124, 99, 71, 0.14); color: var(--brown); }

  .link-soon {
    background: var(--beige-light);
    color: var(--ink-soft);
    border: 1px dashed rgba(115, 30, 29, 0.25);
    cursor: default;
    pointer-events: none;
  }
  .link-soon .link-icon { background: rgba(115, 30, 29, 0.08); color: var(--burgundy); }
  .link-soon .link-label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .link-soon .link-label span:first-child { color: var(--ink); font-weight: 500; }
  .link-soon .soon-tag {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--burgundy);
    font-weight: 600;
  }

  .footer {
    margin-top: 32px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  .footer strong { color: var(--brown); }

  @media (max-width: 400px) {
    .card { padding: 36px 24px 28px; border-radius: 22px; }
    .brand { font-size: 2rem; }
  }
</style>
</head>
